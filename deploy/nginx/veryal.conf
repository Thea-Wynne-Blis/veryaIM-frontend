# VERYAL 站点（仅此文件对外服务，端口 8899）
# 前端静态文件 + /api + /ws + /swagger 全部由本站点代理

upstream veryal_ws {
    server 127.0.0.1:9098;
}

upstream veryal_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 8899;
    listen [::]:8899;
    server_name _;

    root /home/ubuntu/veryal/web;
    index index.html;

    charset utf-8;
    server_tokens off;

    client_max_body_size 100m;

    access_log /var/log/nginx/veryal.access.log;
    error_log  /var/log/nginx/veryal.error.log warn;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # ---------- 前端静态资源 ----------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }


    # ---------- 运营后台（/system/）----------
    location = /system {
        return 301 /system/;
    }

    location = /system.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /system/ {
        try_files $uri /system.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- HTTP API ----------
    location /api/ {
        proxy_pass http://veryal_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # ---------- Swagger / OpenAPI ----------
    location = /swagger-ui.html {
        proxy_pass http://veryal_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix "";
    }

    location /swagger-ui/ {
        proxy_pass http://veryal_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix "";
    }

    location /v3/api-docs {
        proxy_pass http://veryal_backend;
        proxy_set_header Host $host;
    }

    # ---------- WebSocket ----------
    location /ws {
        proxy_pass http://veryal_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- 健康检查 ----------
    location /actuator/ {
        proxy_pass http://veryal_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
